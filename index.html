<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Drive TKD</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f7f6f3;
  --surface: #ffffff;
  --surface2: #f0ede8;
  --border: #e5e1da;
  --text: #1a1816;
  --text2: #6b6560;
  --text3: #a09890;
  --accent: #c9622f;
  --accent-light: #fdf0e8;
  --shadow: 0 1px 4px rgba(0,0,0,0.07);
  --radius: 10px;
}
[data-theme="dark"] {
  --bg: #141210;
  --surface: #1e1b18;
  --surface2: #252118;
  --border: #2e2a24;
  --text: #f0ece6;
  --text2: #8a8278;
  --text3: #5a5248;
  --accent: #e07840;
  --accent-light: #2a1a0e;
  --shadow: 0 1px 4px rgba(0,0,0,0.3);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Prompt',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .3s,color .3s}

/* HEADER */
.header{position:sticky;top:0;z-index:100;background:var(--surface);border-bottom:1px solid var(--border);padding:0 1.5rem}
.header-top{display:flex;align-items:center;justify-content:space-between;padding:1rem 0 .75rem;gap:1rem}
.logo{font-size:18px;font-weight:600;letter-spacing:-.02em}
.logo span{color:var(--accent)}
.header-right{display:flex;align-items:center;gap:8px}
.search-box{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:7px 12px;width:220px;transition:border-color .2s,width .3s}
.search-box:focus-within{border-color:var(--accent);width:280px}
.search-box svg{color:var(--text3);flex-shrink:0}
.search-box input{background:none;border:none;outline:none;font-family:'Prompt',sans-serif;font-size:13px;color:var(--text);width:100%}
.search-box input::placeholder{color:var(--text3)}
.icon-btn{width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}

/* SHEET TABS */
.sheet-tabs{display:flex;gap:4px}
.sheet-tab{padding:8px 22px;border-radius:8px 8px 0 0;border:1px solid transparent;border-bottom:none;font-family:'Prompt',sans-serif;font-size:13px;font-weight:500;cursor:pointer;color:var(--text2);background:none;transition:all .2s;position:relative;bottom:-1px}
.sheet-tab:hover{color:var(--text);background:var(--surface2)}
.sheet-tab.active{color:var(--accent);background:var(--surface);border-color:var(--border);border-bottom-color:var(--surface)}

/* CONTENT */
.content{padding:1.5rem;max-width:1200px;margin:0 auto}

/* STATS */
.stats-bar{display:flex;gap:8px;margin-bottom:1.25rem;flex-wrap:wrap;align-items:center}
.stat-chip{padding:4px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--border);font-size:12px;color:var(--text2)}
.stat-chip strong{color:var(--text)}
.refresh-btn{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text3);background:none;border:none;cursor:pointer;font-family:'Prompt',sans-serif;margin-left:auto}
.refresh-btn:hover{color:var(--accent)}
.refresh-btn svg{transition:transform .3s}
.refresh-btn:hover svg{transform:rotate(180deg)}
.spinning{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* FILTERS */
.cat-filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1.25rem}
.cat-btn{padding:5px 14px;border-radius:99px;border:1px solid var(--border);background:var(--surface);font-family:'Prompt',sans-serif;font-size:12px;color:var(--text2);cursor:pointer;transition:all .15s}
.cat-btn:hover{border-color:var(--accent);color:var(--accent)}
.cat-btn.active{background:var(--text);color:var(--bg);border-color:var(--text)}

/* TOOLBAR */
.toolbar{display:flex;align-items:center;gap:6px;margin-bottom:1.25rem;flex-wrap:wrap}
.toolbar-label{font-size:12px;color:var(--text3)}
.sort-btn{padding:4px 12px;border-radius:6px;border:1px solid var(--border);background:var(--surface);font-family:'Prompt',sans-serif;font-size:12px;color:var(--text2);cursor:pointer;transition:all .15s}
.sort-btn:hover,.sort-btn.active{border-color:var(--accent);color:var(--accent)}
.free-toggle{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);cursor:pointer;user-select:none}
.toggle-sw{width:32px;height:18px;background:var(--border);border-radius:99px;position:relative;transition:background .2s;flex-shrink:0}
.toggle-sw.on{background:var(--accent)}
.toggle-sw::after{content:'';position:absolute;width:14px;height:14px;background:white;border-radius:50%;top:2px;left:2px;transition:left .2s}
.toggle-sw.on::after{left:16px}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:8px;transition:border-color .15s,transform .15s,box-shadow .15s}
.card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow)}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:6px}
.card-name{font-size:13px;font-weight:500;color:var(--text);line-height:1.45;flex:1}
.type-badge{font-size:10px;font-weight:500;padding:2px 8px;border-radius:99px;flex-shrink:0;white-space:nowrap}
.card-group{font-size:11px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-footer{display:flex;align-items:center;justify-content:space-between;margin-top:2px}
.price{font-size:14px;font-weight:600;color:var(--text)}
.price.free{color:#16a34a;font-size:12px;font-weight:500}
[data-theme="dark"] .price.free{color:#4ade80}
.open-btn{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--accent);text-decoration:none;padding:3px 9px;border-radius:6px;border:1px solid var(--accent-light);background:var(--accent-light);transition:all .15s;font-family:'Prompt',sans-serif;white-space:nowrap}
.open-btn:hover{background:var(--accent);color:white;border-color:var(--accent)}
.no-link{font-size:11px;color:var(--text3)}

/* TYPE COLORS */
.type-บล็อก{background:#dbeafe;color:#1e40af}
.type-ตูน{background:#ede9fe;color:#5b21b6}
.type-BG{background:#d1fae5;color:#065f46}
.type-font{background:#fef3c7;color:#92400e}
.type-ของตกเเต่ง,.type-ของตกแต่ง{background:#fce7f3;color:#9d174d}
.type-รวมมิตร{background:#e0f2fe;color:#0c4a6e}
.type-ลายเส้น{background:#ffedd5;color:#9a3412}
[data-theme="dark"] .type-บล็อก{background:#1e3a5f;color:#93c5fd}
[data-theme="dark"] .type-ตูน{background:#2e1a5e;color:#c4b5fd}
[data-theme="dark"] .type-BG{background:#064e3b;color:#6ee7b7}
[data-theme="dark"] .type-font{background:#451a03;color:#fcd34d}
[data-theme="dark"] .type-ของตกเเต่ง,[data-theme="dark"] .type-ของตกแต่ง{background:#500724;color:#f9a8d4}
[data-theme="dark"] .type-รวมมิตร{background:#0c2a3e;color:#7dd3fc}
[data-theme="dark"] .type-ลายเส้น{background:#431407;color:#fdba74}

/* TABLE */
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.simple-table{width:100%;border-collapse:collapse;font-size:13px}
.simple-table th{text-align:left;padding:10px 14px;background:var(--surface2);color:var(--text2);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border)}
.simple-table td{padding:10px 14px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle}
.simple-table tr:last-child td{border-bottom:none}
.simple-table tr:hover td{background:var(--surface2)}
.simple-table a{color:var(--accent);text-decoration:none;font-size:12px}
.simple-table a:hover{text-decoration:underline}

/* EMPTY / LOADING */
.empty{grid-column:1/-1;text-align:center;padding:4rem 1rem;color:var(--text3)}
.empty-icon{font-size:36px;margin-bottom:10px}
.loading{text-align:center;padding:4rem;color:var(--text3);font-size:14px}
.spinner-wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.spinner{width:28px;height:28px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}

@media(max-width:600px){
  .search-box{width:150px}.search-box:focus-within{width:190px}
  .content{padding:1rem}.header{padding:0 1rem}
  .grid{grid-template-columns:repeat(auto-fill,minmax(155px,1fr))}
  .sheet-tab{padding:8px 14px}
}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="logo">Stock<span>Drive</span> TKD</div>
    <div class="header-right">
      <div class="search-box">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="searchInput" placeholder="ค้นหา..." oninput="applyFilters()">
      </div>
      <button class="icon-btn" onclick="toggleTheme()" title="เปลี่ยนธีม" id="themeBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="themeIcon"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>
    </div>
  </div>
  <div class="sheet-tabs">
    <button class="sheet-tab active" onclick="switchSheet('กลุ่มต่าง ๆ',this)">กลุ่มต่าง ๆ</button>
    <button class="sheet-tab" onclick="switchSheet('เบส',this)">เบส</button>
    <button class="sheet-tab" onclick="switchSheet('บรัช',this)">บรัช</button>
  </div>
</div>

<div class="content">
  <div id="mainContent">
    <div class="loading"><div class="spinner-wrap"><div class="spinner"></div><span>กำลังโหลดข้อมูล...</span></div></div>
  </div>
</div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbwOIchXdRjJtQu4kyhP7eBk-bWQ4vJQ3b6qBeNsOAK4X_uqX01JIPh7-MC14c8v7Md4Ug/exec';

let allData = {};
let currentSheet = 'กลุ่มต่าง ๆ';
let activeCategory = 'ทั้งหมด';
let freeOnly = false;
let sortMode = 'default';
let lastUpdated = null;
let isLoading = false;

// Theme init
const savedTheme = localStorage.getItem('tkd-theme') || 'light';
document.documentElement.setAttribute('data-theme', savedTheme);
updateThemeIcon(savedTheme);

function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('tkd-theme', next);
  updateThemeIcon(next);
}
function updateThemeIcon(t) {
  const el = document.getElementById('themeIcon');
  if (!el) return;
  el.innerHTML = t === 'dark'
    ? '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>'
    : '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
}

// Fetch data
async function fetchData(showSpinner) {
  if (isLoading) return;
  isLoading = true;
  const btn = document.querySelector('.refresh-btn svg');
  if (btn) btn.classList.add('spinning');
  if (showSpinner) {
    document.getElementById('mainContent').innerHTML = '<div class="loading"><div class="spinner-wrap"><div class="spinner"></div><span>กำลังโหลดข้อมูล...</span></div></div>';
  }
  try {
    const res = await fetch(API);
    allData = await res.json();
    lastUpdated = new Date();
    renderCurrentSheet();
  } catch(e) {
    document.getElementById('mainContent').innerHTML = `
      <div class="loading" style="color:var(--text2)">
        <div style="font-size:32px;margin-bottom:10px">⚠️</div>
        <p>โหลดข้อมูลไม่ได้</p>
        <p style="font-size:11px;margin-top:6px;color:var(--text3)">${e.message}</p>
        <button onclick="fetchData(true)" style="margin-top:16px;padding:8px 20px;border-radius:8px;border:1px solid var(--accent);background:var(--accent-light);color:var(--accent);cursor:pointer;font-family:Prompt,sans-serif;font-size:13px">ลองใหม่</button>
      </div>`;
  } finally {
    isLoading = false;
    const b2 = document.querySelector('.refresh-btn svg');
    if (b2) b2.classList.remove('spinning');
  }
}

function switchSheet(name, el) {
  currentSheet = name;
  activeCategory = 'ทั้งหมด';
  freeOnly = false;
  sortMode = 'default';
  document.querySelectorAll('.sheet-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('searchInput').value = '';
  renderCurrentSheet();
}

function renderCurrentSheet() {
  const raw = allData[currentSheet];
  if (!raw) return;
  if (currentSheet === 'กลุ่มต่าง ๆ') renderGroupSheet(raw);
  else renderSimpleSheet(raw);
}

// Parse กลุ่มต่าง ๆ — col B=group, C=name, D=url, E=type, F=price1, G=price2
function parseItems(raw) {
  const items = [];
  for (let i = 4; i < raw.length; i++) {
    const r = raw[i];
    const group = String(r[1] || '').trim();
    const name  = String(r[2] || '').trim();
    const url   = String(r[3] || '').trim();
    const type  = String(r[4] || '').trim();
    // price: col F (index5) or G (index6), take whichever is a valid number
    const p1 = parseFloat(r[5]);
    const p2 = parseFloat(r[6]);
    const price = !isNaN(p2) && p2 >= 0 ? p2 : (!isNaN(p1) && p1 >= 0 ? p1 : 0);
    if (!name) continue;
    const validUrl = url.startsWith('http') ? url : '';
    items.push({ group, name, url: validUrl, type, price });
  }
  return items;
}

function renderGroupSheet(raw) {
  const items = parseItems(raw);
  const types = ['ทั้งหมด', ...new Set(items.map(d => d.type).filter(Boolean))];
  const total = items.length;
  const freeC = items.filter(d => d.price === 0).length;
  const paidC = total - freeC;
  const timeStr = lastUpdated ? lastUpdated.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}) : '';

  document.getElementById('mainContent').innerHTML = `
    <div class="stats-bar">
      <div class="stat-chip">ทั้งหมด <strong>${total}</strong></div>
      <div class="stat-chip">ฟรี <strong>${freeC}</strong></div>
      <div class="stat-chip">มีราคา <strong>${paidC}</strong></div>
      <button class="refresh-btn" onclick="fetchData(false)" title="รีเฟรช">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        ${timeStr ? 'อัปเดต ' + timeStr : 'รีเฟรช'}
      </button>
    </div>
    <div class="cat-filter" id="catFilter">
      ${types.map(t => `<button class="cat-btn${t===activeCategory?' active':''}" onclick="setCategory('${t}')">${t}</button>`).join('')}
    </div>
    <div class="toolbar">
      <span class="toolbar-label">เรียงตาม</span>
      <button class="sort-btn${sortMode==='default'?' active':''}" onclick="setSort('default',this)">ค่าเริ่มต้น</button>
      <button class="sort-btn${sortMode==='price-asc'?' active':''}" onclick="setSort('price-asc',this)">ราคา ↑</button>
      <button class="sort-btn${sortMode==='price-desc'?' active':''}" onclick="setSort('price-desc',this)">ราคา ↓</button>
      <button class="sort-btn${sortMode==='name'?' active':''}" onclick="setSort('name',this)">ชื่อ A-Z</button>
      <label class="free-toggle" onclick="toggleFree()">
        <div class="toggle-sw${freeOnly?' on':''}" id="freeSw"></div>ฟรีเท่านั้น
      </label>
    </div>
    <div class="grid" id="cardGrid"></div>
  `;
  applyFilters();
}

function applyFilters() {
  const raw = allData[currentSheet];
  if (!raw || currentSheet !== 'กลุ่มต่าง ๆ') return;
  const items = parseItems(raw);
  const q = (document.getElementById('searchInput').value || '').toLowerCase().trim();

  let filtered = items.filter(d => {
    const matchCat = activeCategory === 'ทั้งหมด' || d.type === activeCategory;
    const matchFree = !freeOnly || d.price === 0;
    const matchQ = !q || d.name.toLowerCase().includes(q) || d.group.toLowerCase().includes(q) || d.type.toLowerCase().includes(q);
    return matchCat && matchFree && matchQ;
  });

  if (sortMode === 'price-asc') filtered.sort((a,b) => a.price - b.price);
  else if (sortMode === 'price-desc') filtered.sort((a,b) => b.price - a.price);
  else if (sortMode === 'name') filtered.sort((a,b) => a.name.localeCompare(b.name,'th'));

  const grid = document.getElementById('cardGrid');
  if (!grid) return;

  if (!filtered.length) {
    grid.innerHTML = '<div class="empty"><div class="empty-icon">🔍</div><p>ไม่พบรายการที่ค้นหา</p></div>';
    return;
  }

  grid.innerHTML = filtered.map(d => {
    const priceHtml = d.price === 0
      ? '<span class="price free">🎁 ฟรี</span>'
      : `<span class="price">฿${Number.isInteger(d.price) ? d.price : d.price.toFixed(1)}</span>`;
    const linkHtml = d.url
      ? `<a class="open-btn" href="${d.url}" target="_blank" rel="noopener">เปิด ↗</a>`
      : '<span class="no-link">ไม่มีลิงก์</span>';
    const tc = 'type-' + d.type.replace(/\s+/g,'');
    return `<div class="card">
      <div class="card-head">
        <div class="card-name">${escHtml(d.name)}</div>
        <span class="type-badge ${tc}">${escHtml(d.type)}</span>
      </div>
      <div class="card-group" title="${escHtml(d.group)}">${escHtml(d.group) || '—'}</div>
      <div class="card-footer">${priceHtml}${linkHtml}</div>
    </div>`;
  }).join('');
}

function setCategory(cat) {
  activeCategory = cat;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.toggle('active', b.textContent.trim() === cat));
  applyFilters();
}
function setSort(mode, el) {
  sortMode = mode;
  document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
  if (el) el.classList.add('active');
  applyFilters();
}
function toggleFree() {
  freeOnly = !freeOnly;
  const el = document.getElementById('freeSw');
  if (el) el.classList.toggle('on', freeOnly);
  applyFilters();
}

// Simple sheet (เบส / บรัช)
function renderSimpleSheet(raw) {
  const q = (document.getElementById('searchInput').value || '').toLowerCase().trim();
  let headerIdx = 0;
  for (let i = 0; i < Math.min(8, raw.length); i++) {
    if (raw[i].some(c => c && String(c).trim())) { headerIdx = i; break; }
  }
  const headers = raw[headerIdx].map(h => String(h||'').trim()).filter(h => h);
  const rows = raw.slice(headerIdx+1).filter(r => r.some(c => String(c||'').trim()));
  const filtered = q ? rows.filter(r => r.some(c => String(c).toLowerCase().includes(q))) : rows;
  const timeStr = lastUpdated ? lastUpdated.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}) : '';

  document.getElementById('mainContent').innerHTML = `
    <div class="stats-bar">
      <div class="stat-chip">ทั้งหมด <strong>${rows.length}</strong> รายการ</div>
      <button class="refresh-btn" onclick="fetchData(false)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        ${timeStr ? 'อัปเดต ' + timeStr : 'รีเฟรช'}
      </button>
    </div>
    <div class="table-wrap">
      <table class="simple-table">
        <thead><tr>${headers.map(h=>`<th>${escHtml(h)}</th>`).join('')}</tr></thead>
        <tbody>${filtered.length
          ? filtered.map(r=>`<tr>${headers.map((_,i)=>{
              const v = String(r[i]||'').trim();
              const cell = v.startsWith('http') ? `<a href="${v}" target="_blank" rel="noopener">เปิดลิงก์ ↗</a>` : escHtml(v||'—');
              return `<td>${cell}</td>`;
            }).join('')}</tr>`).join('')
          : `<tr><td colspan="${headers.length}" style="text-align:center;color:var(--text3);padding:2rem">ไม่พบข้อมูล</td></tr>`
        }</tbody>
      </table>
    </div>
  `;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Start
fetchData(true);
</script>
