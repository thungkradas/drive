<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Drive TKD</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0d0c0f;--surface:#16141a;--surface2:#1e1b24;--border:#2a2733;
  --text:#f0ece6;--text2:#8a8278;--text3:#5a5258;
  --accent:#e07840;--accent-light:rgba(224,120,64,.12);
  --shadow:0 1px 4px rgba(0,0,0,.4);--radius:10px;
  --c-บล็อก-bg:#1e3a5f;--c-บล็อก-fg:#93c5fd;
  --c-ตูน-bg:#2e1a5e;--c-ตูน-fg:#c4b5fd;
  --c-BG-bg:#064e3b;--c-BG-fg:#6ee7b7;
  --c-font-bg:#451a03;--c-font-fg:#fcd34d;
  --c-deco-bg:#500724;--c-deco-fg:#f9a8d4;
  --c-mix-bg:#0c2a3e;--c-mix-fg:#7dd3fc;
  --c-line-bg:#431407;--c-line-fg:#fdba74;
  --c-ef-bg:#1a2a1a;--c-ef-fg:#86efac;
}
[data-theme="light"]{
  --bg:#f7f6f3;--surface:#fff;--surface2:#f0ede8;--border:#e5e1da;
  --text:#1a1816;--text2:#6b6560;--text3:#a09890;
  --accent:#c9622f;--accent-light:rgba(201,98,47,.1);
  --shadow:0 1px 4px rgba(0,0,0,.07);
  --c-บล็อก-bg:#dbeafe;--c-บล็อก-fg:#1e40af;
  --c-ตูน-bg:#ede9fe;--c-ตูน-fg:#5b21b6;
  --c-BG-bg:#d1fae5;--c-BG-fg:#065f46;
  --c-font-bg:#fef3c7;--c-font-fg:#92400e;
  --c-deco-bg:#fce7f3;--c-deco-fg:#9d174d;
  --c-mix-bg:#e0f2fe;--c-mix-fg:#0c4a6e;
  --c-line-bg:#ffedd5;--c-line-fg:#9a3412;
  --c-ef-bg:#dcfce7;--c-ef-fg:#166534;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Prompt',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .3s,color .3s;overflow-x:hidden}

/* STARFIELD */
#starCanvas{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.7}
[data-theme="light"] #starCanvas{opacity:.25}

/* HEADER */
.header{position:sticky;top:0;z-index:100;background:rgba(22,20,26,.85);border-bottom:1px solid var(--border);padding:0 1.5rem;backdrop-filter:blur(12px)}
[data-theme="light"] .header{background:rgba(255,255,255,.88)}
.header-top{display:flex;align-items:center;justify-content:space-between;padding:.9rem 0 .7rem;gap:1rem}
.logo{font-size:17px;font-weight:600;letter-spacing:-.02em}
.logo span{color:var(--accent)}
.header-right{display:flex;align-items:center;gap:7px}
.search-box{display:flex;align-items:center;gap:7px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 11px;width:210px;transition:border-color .2s,width .3s}
.search-box:focus-within{border-color:var(--accent);width:270px}
.search-box svg{color:var(--text3);flex-shrink:0}
.search-box input{background:none;border:none;outline:none;font-family:'Prompt',sans-serif;font-size:13px;color:var(--text);width:100%}
.search-box input::placeholder{color:var(--text3)}
.icon-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.sheet-tabs{display:flex;gap:3px}
.sheet-tab{padding:7px 20px;border-radius:8px 8px 0 0;border:1px solid transparent;border-bottom:none;font-family:'Prompt',sans-serif;font-size:13px;font-weight:500;cursor:pointer;color:var(--text2);background:none;transition:all .2s;position:relative;bottom:-1px}
.sheet-tab:hover{color:var(--text);background:var(--surface2)}
.sheet-tab.active{color:var(--accent);background:var(--surface);border-color:var(--border);border-bottom-color:var(--surface)}

/* CONTENT */
.content{padding:1.25rem 1.5rem;max-width:1200px;margin:0 auto;position:relative;z-index:1}
.stats-bar{display:flex;gap:7px;margin-bottom:1.1rem;flex-wrap:wrap;align-items:center}
.stat-chip{padding:3px 11px;border-radius:99px;background:var(--surface);border:1px solid var(--border);font-size:11px;color:var(--text2)}
.stat-chip strong{color:var(--text)}
.refresh-btn{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text3);background:none;border:none;cursor:pointer;font-family:'Prompt',sans-serif;margin-left:auto}
.refresh-btn:hover{color:var(--accent)}
.refresh-btn svg{transition:transform .3s}
.refresh-btn:hover svg{transform:rotate(180deg)}
@keyframes spin{to{transform:rotate(360deg)}}
.spinning{animation:spin .8s linear infinite}

/* CAT FILTER */
.cat-filter{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:1.1rem}
.cat-btn{padding:4px 13px;border-radius:99px;border:1px solid var(--border);background:var(--surface);font-family:'Prompt',sans-serif;font-size:12px;color:var(--text2);cursor:pointer;transition:all .15s}
.cat-btn:hover{border-color:var(--accent);color:var(--accent)}
.cat-btn.active{background:var(--text);color:var(--bg);border-color:var(--text)}

/* TOOLBAR */
.toolbar{display:flex;align-items:center;gap:6px;margin-bottom:1.1rem;flex-wrap:wrap}
.toolbar-label{font-size:11px;color:var(--text3)}
.sort-btn{padding:3px 11px;border-radius:6px;border:1px solid var(--border);background:var(--surface);font-family:'Prompt',sans-serif;font-size:11px;color:var(--text2);cursor:pointer;transition:all .15s}
.sort-btn:hover,.sort-btn.active{border-color:var(--accent);color:var(--accent)}
.free-toggle{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text2);cursor:pointer;user-select:none}
.toggle-sw{width:30px;height:17px;background:var(--border);border-radius:99px;position:relative;transition:background .2s;flex-shrink:0}
.toggle-sw.on{background:var(--accent)}
.toggle-sw::after{content:'';position:absolute;width:13px;height:13px;background:white;border-radius:50%;top:2px;left:2px;transition:left .2s}
.toggle-sw.on::after{left:15px}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:13px;display:flex;flex-direction:column;gap:7px;transition:border-color .15s,transform .15s,box-shadow .15s}
.card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow)}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:6px}
.card-name{font-size:14px;font-weight:500;color:var(--text);line-height:1.4;flex:1}
.type-badge{font-size:10px;font-weight:500;padding:2px 8px;border-radius:99px;flex-shrink:0;white-space:nowrap}
.card-group{font-size:11px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-footer{display:flex;align-items:center;justify-content:space-between;margin-top:1px}
.price{font-size:11px;font-weight:500;color:var(--text2)}
.price.free{color:#4ade80}
[data-theme="light"] .price.free{color:#16a34a}
.open-btn{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--accent);text-decoration:none;padding:3px 9px;border-radius:6px;border:1px solid var(--accent-light);background:var(--accent-light);transition:all .15s;font-family:'Prompt',sans-serif;white-space:nowrap}
.open-btn:hover{background:var(--accent);color:white;border-color:var(--accent)}
.no-link{font-size:11px;color:var(--text3)}

/* TYPE BADGES */
.tb-บล็อก{background:var(--c-บล็อก-bg);color:var(--c-บล็อก-fg)}
.tb-ตูน{background:var(--c-ตูน-bg);color:var(--c-ตูน-fg)}
.tb-BG{background:var(--c-BG-bg);color:var(--c-BG-fg)}
.tb-font{background:var(--c-font-bg);color:var(--c-font-fg)}
.tb-deco{background:var(--c-deco-bg);color:var(--c-deco-fg)}
.tb-mix{background:var(--c-mix-bg);color:var(--c-mix-fg)}
.tb-line{background:var(--c-line-bg);color:var(--c-line-fg)}
.tb-ef{background:var(--c-ef-bg);color:var(--c-ef-fg)}

/* EF SECTION */
.ef-section{margin-bottom:1.5rem}
.ef-section-header{display:flex;align-items:center;gap:10px;margin-bottom:.75rem}
.ef-section-title{font-size:13px;font-weight:500;color:var(--text2);letter-spacing:.02em;text-transform:uppercase}
.ef-add-btn{display:flex;align-items:center;gap:4px;padding:4px 12px;border-radius:6px;border:1px dashed var(--border);background:none;font-family:'Prompt',sans-serif;font-size:12px;color:var(--text3);cursor:pointer;transition:all .15s}
.ef-add-btn:hover{border-color:var(--accent);color:var(--accent)}
.ef-rooms-row{display:flex;flex-wrap:wrap;gap:6px}
.ef-room-chip{display:flex;align-items:center;gap:5px;padding:5px 14px;border-radius:8px;background:var(--surface);border:1px solid var(--border);font-size:12px;color:var(--text2);cursor:pointer;transition:all .15s}
.ef-room-chip:hover{border-color:var(--accent);color:var(--text)}
.ef-room-chip.active{background:var(--c-ef-bg);color:var(--c-ef-fg);border-color:var(--c-ef-fg)}
.ef-room-del{font-size:15px;line-height:1;color:var(--text3);transition:color .15s}
.ef-room-del:hover{color:#f87171}
.ef-empty{font-size:12px;color:var(--text3)}

/* EF DETAIL PANEL */
.ef-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-top:.75rem;margin-bottom:1.25rem}
.ef-panel-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--surface2)}
.ef-panel-title{font-size:14px;font-weight:500;color:var(--text)}
.ef-panel-sub{font-size:11px;color:var(--text3);margin-top:2px}
.ef-table{width:100%;border-collapse:collapse;font-size:13px}
.ef-table th{text-align:left;padding:9px 16px;background:var(--surface2);color:var(--text3);font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border)}
.ef-table td{padding:9px 16px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle}
.ef-table tr:last-child td{border-bottom:none}
.ef-table tr:hover td{background:var(--surface2)}
.ef-table .td-name{font-weight:500}
.ef-table .td-group{font-size:11px;color:var(--text3)}
.ef-table .td-price{font-size:11px;color:var(--text2)}
.ef-table .td-price.free{color:#4ade80}
[data-theme="light"] .ef-table .td-price.free{color:#16a34a}
.ef-table .td-link a{color:var(--accent);text-decoration:none;font-size:12px;padding:2px 8px;border-radius:5px;border:1px solid var(--accent-light);background:var(--accent-light)}
.ef-table .td-link a:hover{background:var(--accent);color:white}
.ef-no-items{padding:2rem;text-align:center;color:var(--text3);font-size:13px}

/* MODALS */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
.modal-box{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.5rem;width:340px;max-width:90vw}
.modal-box h3{font-size:15px;font-weight:600;margin-bottom:1rem;color:var(--text)}
.modal-box label{font-size:12px;color:var(--text2);display:block;margin-bottom:4px}
.modal-box input{width:100%;padding:8px 11px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);font-family:'Prompt',sans-serif;font-size:13px;color:var(--text);outline:none;margin-bottom:.75rem}
.modal-box input:focus{border-color:var(--accent)}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:.5rem}
.btn-cancel{padding:7px 16px;border-radius:8px;border:1px solid var(--border);background:none;font-family:'Prompt',sans-serif;font-size:13px;color:var(--text2);cursor:pointer}
.btn-save{padding:7px 16px;border-radius:8px;border:none;background:var(--accent);font-family:'Prompt',sans-serif;font-size:13px;color:white;cursor:pointer}

/* COLOR PICKER */
.cp-modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.5rem;width:380px;max-width:92vw}
.cp-modal h3{font-size:15px;font-weight:600;margin-bottom:1.2rem;color:var(--text)}
.cp-accent-row{display:flex;align-items:center;gap:10px;margin-bottom:1rem;padding-bottom:1rem;border-bottom:1px solid var(--border)}
.cp-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:.65rem}
.cp-label{font-size:13px;color:var(--text)}
.cp-inputs{display:flex;gap:6px;align-items:center}
.cp-inputs input[type=color]{width:32px;height:26px;border:1px solid var(--border);border-radius:6px;cursor:pointer;background:none;padding:1px}
.cp-inputs span{font-size:10px;color:var(--text3)}
.cp-preview{display:inline-block;padding:2px 10px;border-radius:99px;font-size:11px;font-weight:500;margin-right:6px}
.cp-footer{display:flex;justify-content:space-between;margin-top:1rem;align-items:center}
.btn-reset{font-size:11px;color:var(--text3);background:none;border:none;cursor:pointer;font-family:'Prompt',sans-serif}
.btn-reset:hover{color:var(--accent)}

/* TABLE (เบส/บรัช) */
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.simple-table{width:100%;border-collapse:collapse;font-size:13px}
.simple-table th{text-align:left;padding:9px 14px;background:var(--surface2);color:var(--text3);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border)}
.simple-table td{padding:9px 14px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle}
.simple-table tr:last-child td{border-bottom:none}
.simple-table tr:hover td{background:var(--surface2)}
.tbl-link{color:var(--accent);text-decoration:none;font-size:12px;padding:2px 8px;border-radius:5px;border:1px solid var(--accent-light);background:var(--accent-light)}
.tbl-link:hover{background:var(--accent);color:white}

/* LOADING */
.loading{text-align:center;padding:4rem;color:var(--text3);font-size:14px}
.spinner{width:26px;height:26px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
.empty{grid-column:1/-1;text-align:center;padding:4rem 1rem;color:var(--text3)}

@media(max-width:600px){
  .search-box{width:140px}.search-box:focus-within{width:180px}
  .content{padding:1rem}.header{padding:0 1rem}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .sheet-tab{padding:7px 12px;font-size:12px}
}
</style>
</head>
<body>

<canvas id="starCanvas"></canvas>

<div class="header">
  <div class="header-top">
    <div class="logo">Stock<span>Drive</span> TKD</div>
    <div class="header-right">
      <div class="search-box">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="searchInput" placeholder="ค้นหา..." oninput="applyFilters()">
      </div>
      <button class="icon-btn" onclick="openColorPicker()" title="ตั้งค่าสี">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 1 0 10 10"/><path d="M12 8v4l3 3"/><circle cx="18" cy="6" r="3"/></svg>
      </button>
      <button class="icon-btn" onclick="toggleTheme()" title="เปลี่ยนธีม">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="themeIcon"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>
    </div>
  </div>
  <div class="sheet-tabs">
    <button class="sheet-tab active" onclick="switchSheet('กลุ่มต่าง ๆ',this)">กลุ่มต่าง ๆ</button>
    <button class="sheet-tab" onclick="switchSheet('เบส',this)">เบส</button>
    <button class="sheet-tab" onclick="switchSheet('บรัช',this)">บรัช</button>
  </div>
</div>

<div class="content"><div id="mainContent">
  <div class="loading"><div class="spinner"></div>กำลังโหลดข้อมูล...</div>
</div></div>

<!-- EF MODAL -->
<div id="efModal" class="modal-bg" style="display:none" onclick="if(event.target===this)closeEfModal()">
  <div class="modal-box">
    <h3>เพิ่มห้องเอฟ</h3>
    <label>ชื่อห้องเอฟ (แสดงผล)</label>
    <input type="text" id="efName" placeholder="เช่น ห้องเอฟพี่นอร์ท">
    <label>รหัส (ใช้ match กับชื่อกลุ่มใน Sheet)</label>
    <input type="text" id="efKey" placeholder="เช่น ห้องเอฟพี่นอร์ท หรือ NOIR">
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeEfModal()">ยกเลิก</button>
      <button class="btn-save" onclick="saveEfRoom()">บันทึก</button>
    </div>
  </div>
</div>

<!-- COLOR PICKER MODAL -->
<div id="cpModal" class="modal-bg" style="display:none" onclick="if(event.target===this)closeColorPicker()">
  <div class="cp-modal">
    <h3>ตั้งค่าสี</h3>
    <div class="cp-accent-row">
      <div style="font-size:13px;color:var(--text);flex:1">สีหลัก</div>
      <input type="color" id="cp-accent" oninput="previewAccent(this.value)">
      <button class="btn-reset" onclick="resetAccent()">รีเซ็ต</button>
    </div>
    <div id="cpRows"></div>
    <div class="cp-footer">
      <button class="btn-reset" onclick="resetAllColors()">รีเซ็ตทั้งหมด</button>
      <button class="btn-save" onclick="saveColors()">บันทึก</button>
    </div>
  </div>
</div>

<script>
const API='https://script.google.com/macros/s/AKfycbwOIchXdRjJtQu4kyhP7eBk-bWQ4vJQ3b6qBeNsOAK4X_uqX01JIPh7-MC14c8v7Md4Ug/exec';
let allData={},currentSheet='กลุ่มต่าง ๆ',activeCategory='ทั้งหมด';
let freeOnly=false,sortMode='default',lastUpdated=null,isLoading=false;
let activeEfIdx=null;
let efRooms=JSON.parse(localStorage.getItem('tkd-ef-rooms')||'[]');

// ---- STARS ----
(function(){
  const c=document.getElementById('starCanvas');
  const ctx=c.getContext('2d');
  let stars=[];
  function resize(){c.width=window.innerWidth;c.height=window.innerHeight;init();}
  function init(){
    stars=[];
    const n=Math.floor((c.width*c.height)/5000);
    for(let i=0;i<n;i++){
      stars.push({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.3+.2,a:Math.random(),da:(Math.random()-.5)*.003,speed:Math.random()*.15+.05});
    }
  }
  function draw(){
    ctx.clearRect(0,0,c.width,c.height);
    const dark=document.documentElement.getAttribute('data-theme')!=='light';
    stars.forEach(s=>{
      s.a+=s.da;
      if(s.a>1||s.a<0)s.da*=-1;
      s.y+=s.speed;
      if(s.y>c.height)s.y=0;
      ctx.beginPath();
      ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle=dark?`rgba(255,255,255,${s.a})`:`rgba(80,60,120,${s.a*.6})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize',resize);
  resize();draw();
})();

// ---- THEME ----
const savedTheme=localStorage.getItem('tkd-theme')||'dark';
document.documentElement.setAttribute('data-theme',savedTheme);
updateThemeIcon(savedTheme);

function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme');
  const next=cur==='light'?'dark':'light';
  document.documentElement.setAttribute('data-theme',next);
  localStorage.setItem('tkd-theme',next);
  updateThemeIcon(next);
  loadColors();
}
function updateThemeIcon(t){
  const el=document.getElementById('themeIcon');
  if(!el)return;
  el.innerHTML=t==='dark'
    ?'<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>'
    :'<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
}

// ---- COLORS ----
const typeList=[
  {key:'บล็อก',label:'บล็อก'},{key:'ตูน',label:'ตูน'},{key:'BG',label:'BG'},
  {key:'font',label:'font'},{key:'deco',label:'ของตกแต่ง'},{key:'mix',label:'รวมมิตร'},
  {key:'line',label:'ลายเส้น'},{key:'ef',label:'ห้องเอฟ'},
];
const defColors={
  dark:{'บล็อก':['#1e3a5f','#93c5fd'],'ตูน':['#2e1a5e','#c4b5fd'],'BG':['#064e3b','#6ee7b7'],'font':['#451a03','#fcd34d'],'deco':['#500724','#f9a8d4'],'mix':['#0c2a3e','#7dd3fc'],'line':['#431407','#fdba74'],'ef':['#1a2a1a','#86efac'],'accent':'#e07840'},
  light:{'บล็อก':['#dbeafe','#1e40af'],'ตูน':['#ede9fe','#5b21b6'],'BG':['#d1fae5','#065f46'],'font':['#fef3c7','#92400e'],'deco':['#fce7f3','#9d174d'],'mix':['#e0f2fe','#0c4a6e'],'line':['#ffedd5','#9a3412'],'ef':['#dcfce7','#166534'],'accent':'#c9622f'},
};
function getT(){return document.documentElement.getAttribute('data-theme')||'dark';}
function hexA(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return`rgba(${r},${g},${b},${a})`;}
function loadColors(){
  const t=getT();
  const saved=JSON.parse(localStorage.getItem('tkd-colors')||'{}');
  const m=Object.assign({},defColors[t],saved[t]||{});
  typeList.forEach(({key})=>{
    const [bg,fg]=m[key]||defColors[t][key];
    document.documentElement.style.setProperty(`--c-${key}-bg`,bg);
    document.documentElement.style.setProperty(`--c-${key}-fg`,fg);
  });
  const acc=m.accent||defColors[t].accent;
  document.documentElement.style.setProperty('--accent',acc);
  document.documentElement.style.setProperty('--accent-light',hexA(acc,.12));
}
loadColors();

function openColorPicker(){
  const t=getT();
  const saved=JSON.parse(localStorage.getItem('tkd-colors')||'{}');
  const m=Object.assign({},defColors[t],saved[t]||{});
  document.getElementById('cp-accent').value=m.accent||defColors[t].accent;
  document.getElementById('cpRows').innerHTML=typeList.map(({key,label})=>{
    const [bg,fg]=m[key]||defColors[t][key];
    return`<div class="cp-row">
      <span class="cp-preview tb-${key}" id="cpPv-${key}" style="background:${bg};color:${fg}">${label}</span>
      <div class="cp-inputs">
        <span>พื้นหลัง</span><input type="color" value="${bg}" id="cpBg-${key}" oninput="pvColor('${key}')">
        <span>ตัวอักษร</span><input type="color" value="${fg}" id="cpFg-${key}" oninput="pvColor('${key}')">
      </div>
    </div>`;
  }).join('');
  document.getElementById('cpModal').style.display='flex';
}
function pvColor(k){
  const bg=document.getElementById('cpBg-'+k).value,fg=document.getElementById('cpFg-'+k).value;
  const p=document.getElementById('cpPv-'+k);
  if(p){p.style.background=bg;p.style.color=fg;}
}
function previewAccent(v){document.documentElement.style.setProperty('--accent',v);document.documentElement.style.setProperty('--accent-light',hexA(v,.12));}
function saveColors(){
  const t=getT();
  const saved=JSON.parse(localStorage.getItem('tkd-colors')||'{}');
  if(!saved[t])saved[t]={};
  saved[t].accent=document.getElementById('cp-accent').value;
  typeList.forEach(({key})=>{saved[t][key]=[document.getElementById('cpBg-'+key).value,document.getElementById('cpFg-'+key).value];});
  localStorage.setItem('tkd-colors',JSON.stringify(saved));
  loadColors();closeColorPicker();renderCurrentSheet();
}
function resetAccent(){const v=defColors[getT()].accent;document.getElementById('cp-accent').value=v;previewAccent(v);}
function resetAllColors(){const t=getT();const saved=JSON.parse(localStorage.getItem('tkd-colors')||'{}');delete saved[t];localStorage.setItem('tkd-colors',JSON.stringify(saved));loadColors();closeColorPicker();renderCurrentSheet();}
function closeColorPicker(){document.getElementById('cpModal').style.display='none';}

// ---- EF ROOMS ----
function openEfModal(){
  document.getElementById('efModal').style.display='flex';
  document.getElementById('efName').value='';document.getElementById('efKey').value='';
  setTimeout(()=>document.getElementById('efName').focus(),50);
}
function closeEfModal(){document.getElementById('efModal').style.display='none';}
function saveEfRoom(){
  const name=document.getElementById('efName').value.trim();
  const key=document.getElementById('efKey').value.trim();
  if(!name||!key){alert('กรุณากรอกข้อมูลให้ครบ');return;}
  efRooms.push({name,key});
  localStorage.setItem('tkd-ef-rooms',JSON.stringify(efRooms));
  closeEfModal();renderCurrentSheet();
}
function deleteEfRoom(i,ev){
  ev.stopPropagation();
  if(!confirm('ลบ "'+efRooms[i].name+'" ?'))return;
  efRooms.splice(i,1);
  localStorage.setItem('tkd-ef-rooms',JSON.stringify(efRooms));
  if(activeEfIdx===i)activeEfIdx=null;
  else if(activeEfIdx!==null&&activeEfIdx>i)activeEfIdx--;
  renderCurrentSheet();
}
function selectEfRoom(i){activeEfIdx=activeEfIdx===i?null:i;renderCurrentSheet();}

// ---- FETCH ----
async function fetchData(showSpinner){
  if(isLoading)return;isLoading=true;
  const ic=document.querySelector('.refresh-btn svg');if(ic)ic.classList.add('spinning');
  if(showSpinner)document.getElementById('mainContent').innerHTML='<div class="loading"><div class="spinner"></div>กำลังโหลดข้อมูล...</div>';
  try{const res=await fetch(API);allData=await res.json();lastUpdated=new Date();renderCurrentSheet();}
  catch(e){document.getElementById('mainContent').innerHTML=`<div class="loading"><p style="margin-bottom:10px">โหลดข้อมูลไม่ได้</p><p style="font-size:11px;color:var(--text3)">${e.message}</p><button onclick="fetchData(true)" style="margin-top:14px;padding:7px 18px;border-radius:8px;border:1px solid var(--accent);background:var(--accent-light);color:var(--accent);cursor:pointer;font-family:Prompt,sans-serif;font-size:13px">ลองใหม่</button></div>`;}
  finally{isLoading=false;const ic2=document.querySelector('.refresh-btn svg');if(ic2)ic2.classList.remove('spinning');}
}
function switchSheet(name,el){
  currentSheet=name;activeCategory='ทั้งหมด';freeOnly=false;sortMode='default';activeEfIdx=null;
  document.querySelectorAll('.sheet-tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');
  document.getElementById('searchInput').value='';renderCurrentSheet();
}
function renderCurrentSheet(){
  const raw=allData[currentSheet];if(!raw)return;
  if(currentSheet==='กลุ่มต่าง ๆ')renderGroupSheet(raw);else renderSimpleSheet(raw);
}

// Parse: col index B=1 C=2 D=3 E=4 F=5 G=6
function parseItems(raw){
  const items=[];
  for(let i=4;i<raw.length;i++){
    const r=raw[i];
    const group=String(r[1]||'').trim();
    const name=String(r[2]||'').trim();
    const url=String(r[3]||'').trim();
    const type=String(r[4]||'').trim();
    const p1=parseFloat(r[5]),p2=parseFloat(r[6]);
    const price=!isNaN(p2)&&p2>=0?p2:(!isNaN(p1)&&p1>=0?p1:0);
    if(!name)continue;
    items.push({group,name,url:url.startsWith('http')?url:'',type,price});
  }
  return items;
}
function isEf(group){
  if(efRooms.length>0)return efRooms.some(r=>group.includes(r.key));
  return group.includes('ห้องเอฟ');
}
function tbClass(type){
  const m={'บล็อก':'บล็อก','ตูน':'ตูน','BG':'BG','font':'font','ของตกเเต่ง':'deco','ของตกแต่ง':'deco','รวมมิตร':'mix','ลายเส้น':'line'};
  return'tb-'+(m[type]||'mix');
}

function renderGroupSheet(raw){
  const items=parseItems(raw);
  const nonEf=items.filter(d=>!isEf(d.group));
  const types=['ทั้งหมด',...new Set(nonEf.map(d=>d.type).filter(Boolean))];
  const timeStr=lastUpdated?lastUpdated.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}):'';

  // ef panel html
  let efPanelHtml='';
  if(activeEfIdx!==null&&efRooms[activeEfIdx]){
    const room=efRooms[activeEfIdx];
    const efItems=items.filter(d=>d.group.includes(room.key));
    efPanelHtml=`<div class="ef-panel">
      <div class="ef-panel-header">
        <div>
          <div class="ef-panel-title">${esc(room.name)}</div>
          <div class="ef-panel-sub">รหัส: ${esc(room.key)} &nbsp;·&nbsp; ${efItems.length} รายการ</div>
        </div>
      </div>
      ${efItems.length?`<table class="ef-table">
        <thead><tr><th>ชื่อ</th><th>กลุ่ม</th><th>ประเภท</th><th>ราคา</th><th>ลิงก์</th></tr></thead>
        <tbody>${efItems.map(d=>`<tr>
          <td class="td-name">${esc(d.name)}</td>
          <td class="td-group">${esc(d.group)}</td>
          <td><span class="type-badge tb-ef">${esc(d.type)}</span></td>
          <td class="td-price${d.price===0?' free':''}">${d.price===0?'ฟรี':'฿'+d.price}</td>
          <td class="td-link">${d.url?`<a href="${d.url}" target="_blank" rel="noopener">เปิด</a>`:'—'}</td>
        </tr>`).join('')}</tbody>
      </table>`:'<div class="ef-no-items">ไม่พบรายการในห้องเอฟนี้</div>'}
    </div>`;
  }

  document.getElementById('mainContent').innerHTML=`
    <div class="stats-bar">
      <div class="stat-chip">ทั้งหมด <strong>${items.length}</strong></div>
      <div class="stat-chip">ฟรี <strong>${items.filter(d=>d.price===0).length}</strong></div>
      <div class="stat-chip">มีราคา <strong>${items.filter(d=>d.price>0).length}</strong></div>
      <button class="refresh-btn" onclick="fetchData(false)">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        ${timeStr?'อัปเดต '+timeStr:'รีเฟรช'}
      </button>
    </div>

    <div class="ef-section">
      <div class="ef-section-header">
        <span class="ef-section-title">ห้องเอฟ</span>
        <button class="ef-add-btn" onclick="openEfModal()">+ เพิ่ม</button>
      </div>
      <div class="ef-rooms-row">
        ${efRooms.length===0?'<span class="ef-empty">ยังไม่มีห้องเอฟ — กด + เพิ่มได้เลย</span>':''}
        ${efRooms.map((r,i)=>`<div class="ef-room-chip${activeEfIdx===i?' active':''}" onclick="selectEfRoom(${i})">
          ${esc(r.name)}
          <span class="ef-room-del" onclick="deleteEfRoom(${i},event)" title="ลบ">×</span>
        </div>`).join('')}
      </div>
      ${efPanelHtml}
    </div>

    <div class="cat-filter" id="catFilter">
      ${types.map(t=>`<button class="cat-btn${t===activeCategory?' active':''}" onclick="setCategory('${t}')">${t}</button>`).join('')}
    </div>
    <div class="toolbar">
      <span class="toolbar-label">เรียงตาม</span>
      <button class="sort-btn${sortMode==='default'?' active':''}" onclick="setSort('default',this)">ค่าเริ่มต้น</button>
      <button class="sort-btn${sortMode==='price-asc'?' active':''}" onclick="setSort('price-asc',this)">ราคา ↑</button>
      <button class="sort-btn${sortMode==='price-desc'?' active':''}" onclick="setSort('price-desc',this)">ราคา ↓</button>
      <button class="sort-btn${sortMode==='name'?' active':''}" onclick="setSort('name',this)">ชื่อ A-Z</button>
      <label class="free-toggle" onclick="toggleFree()">
        <div class="toggle-sw${freeOnly?' on':''}" id="freeSw"></div>ฟรีเท่านั้น
      </label>
    </div>
    <div class="grid" id="cardGrid"></div>
  `;
  applyFilters();
}

function applyFilters(){
  const raw=allData[currentSheet];if(!raw||currentSheet!=='กลุ่มต่าง ๆ')return;
  const items=parseItems(raw);
  const q=(document.getElementById('searchInput').value||'').toLowerCase().trim();
  let filtered=items.filter(d=>{
    if(isEf(d.group)&&!q)return false;
    return(activeCategory==='ทั้งหมด'||d.type===activeCategory)&&(!freeOnly||d.price===0)&&(!q||d.name.toLowerCase().includes(q)||d.group.toLowerCase().includes(q)||d.type.toLowerCase().includes(q));
  });
  if(sortMode==='price-asc')filtered.sort((a,b)=>a.price-b.price);
  else if(sortMode==='price-desc')filtered.sort((a,b)=>b.price-a.price);
  else if(sortMode==='name')filtered.sort((a,b)=>a.name.localeCompare(b.name,'th'));
  const grid=document.getElementById('cardGrid');if(!grid)return;
  grid.innerHTML=filtered.length?filtered.map(d=>`<div class="card">
    <div class="card-top"><div class="card-name">${esc(d.name)}</div><span class="type-badge ${tbClass(d.type)}">${esc(d.type)}</span></div>
    <div class="card-group" title="${esc(d.group)}">${esc(d.group)||'—'}</div>
    <div class="card-footer">
      <span class="price${d.price===0?' free':''}">${d.price===0?'ฟรี':'฿'+(Number.isInteger(d.price)?d.price:d.price.toFixed(1))}</span>
      ${d.url?`<a class="open-btn" href="${d.url}" target="_blank" rel="noopener">เปิด</a>`:'<span class="no-link">—</span>'}
    </div>
  </div>`).join(''):'<div class="empty"><p>ไม่พบรายการที่ค้นหา</p></div>';
}

function setCategory(cat){activeCategory=cat;document.querySelectorAll('.cat-btn').forEach(b=>b.classList.toggle('active',b.textContent.trim()===cat));applyFilters();}
function setSort(mode,el){sortMode=mode;document.querySelectorAll('.sort-btn').forEach(b=>b.classList.remove('active'));if(el)el.classList.add('active');applyFilters();}
function toggleFree(){freeOnly=!freeOnly;const el=document.getElementById('freeSw');if(el)el.classList.toggle('on',freeOnly);applyFilters();}

// เบส / บรัช — B=credit C=name D=url E=note
function renderSimpleSheet(raw){
  const q=(document.getElementById('searchInput').value||'').toLowerCase().trim();
  const timeStr=lastUpdated?lastUpdated.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}):'';
  let hIdx=0;
  for(let i=0;i<Math.min(8,raw.length);i++){if(raw[i].some(c=>String(c||'').trim())){hIdx=i;break;}}
  const rows=raw.slice(hIdx+1).filter(r=>String(r[2]||'').trim()||String(r[3]||'').trim());
  const filtered=q?rows.filter(r=>r.some(c=>String(c).toLowerCase().includes(q))):rows;
  document.getElementById('mainContent').innerHTML=`
    <div class="stats-bar">
      <div class="stat-chip">ทั้งหมด <strong>${rows.length}</strong> รายการ</div>
      <button class="refresh-btn" onclick="fetchData(false)">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        ${timeStr?'อัปเดต '+timeStr:'รีเฟรช'}
      </button>
    </div>
    <div class="table-wrap"><table class="simple-table">
      <thead><tr><th>เครดิต</th><th>ชื่อ</th><th>ลิงก์</th><th>หมายเหตุ</th></tr></thead>
      <tbody>${filtered.length?filtered.map(r=>{
        const cr=esc(String(r[1]||'').trim());
        const nm=esc(String(r[2]||'').trim());
        const ur=String(r[3]||'').trim();
        const nt=esc(String(r[4]||'').trim());
        const lk=ur.startsWith('http')?`<a class="tbl-link" href="${ur}" target="_blank" rel="noopener">เปิด</a>`:(ur?esc(ur):'—');
        return`<tr><td>${cr||'—'}</td><td>${nm||'—'}</td><td>${lk}</td><td>${nt||'—'}</td></tr>`;
      }).join(''):`<tr><td colspan="4" style="text-align:center;color:var(--text3);padding:2rem">ไม่พบข้อมูล</td></tr>`}</tbody>
    </table></div>`;
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
fetchData(true);
</script>
</body>
</html>
